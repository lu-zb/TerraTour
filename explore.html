<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探索目的地 · Terra-Tour</title>
    <link rel="stylesheet" href="css/basic.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/page/destination.css">
    <script src="js/navigation.js"></script>
</head>
<body>
    <header class="site-header">
        <nav class="detail-nav container">
            <a class="brand" href="index.html">Terra-Tour</a>
            <a class="btn btn-secondary" href="index.html" data-return>← 返回</a>
        </nav>
    </header>

    <main class="destination-page-main container">
        <header class="page-heading">
            <p class="page-kicker">Find your next destination</p>
            <h1>探索目的地</h1>
            <p>在六处山河与人文风景中，找到下一段想出发的旅程。</p>
        </header>

        <form class="destination-search" id="destination-search" role="search">
            <label class="form-label" for="search-input">搜索目的地</label>
            <div class="destination-search-row">
                <input class="form-input" id="search-input" type="search"
                    placeholder="搜索景点、地区或类型" autocomplete="off">
                <button class="btn btn-primary" type="submit">搜索</button>
            </div>
            <p class="search-status" id="search-status" role="status"></p>
        </form>

        <section class="results-section">
            <h2 id="results-title">全部景点</h2>
            <div class="destination-grid" id="search-results"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner container">
            <div class="footer-brand">
                <a class="footer-logo" href="index.html">Terra-Tour</a>
                <p>Made for the wanderer in you.</p>
            </div>
            <nav class="footer-nav">
                <a href="index.html#about">关于 Terra-Tour</a>
                <a href="index.html#contact">联系我们</a>
            </nav>
        </div>
    </footer>

    <script src="js/destinations.js"></script>
    <script src="js/page/explore.js"></script>
</body>
</html>
