<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/basic.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <header>
        <a href="index.html">返回</a>
        <h1>探索</h1>
    </header>

  <main>
    <section>
      <h2 id="search-title">搜索目的地</h2>

      <form role="search">

        <label for="destination-search">输入景点名称</label>
        <input
          id="destination-search"
          name="keyword"
          type="search"
          placeholder="例如：黄山"
        >

        <button type="submit">搜索</button>
      </form>

      <p role="status">
        <!-- 将在这里显示搜索状态 -->
      </p>

      <ul>
        <!--将在这里生成搜索结果 -->
      </ul>
    </section>
  </main>
</body>
</html>
